name: Build and Release SwanSpeed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Dynamic Version
        id: versioning
        run: |
          git fetch --tags --force || true
          LATEST_TAG=$(git tag -l "v1.0.*" "1.0.*" | sed 's/^v//' | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=${{ github.run_number }}
          else
            CURRENT_PATCH=$(echo "$LATEST_TAG" | awk -F. '{print $3}')
            if [ -n "$CURRENT_PATCH" ] && [ "$CURRENT_PATCH" -eq "$CURRENT_PATCH" ] 2>/dev/null; then
              PATCH=$((CURRENT_PATCH + 1))
            else
              PATCH=${{ github.run_number }}
            fi
          fi

          VERSION_NAME="1.0.${PATCH}"
          VERSION_CODE="${PATCH}"
          TAG_NAME="v1.0.${PATCH}"

          echo "Calculated version: ${VERSION_NAME} (code: ${VERSION_CODE}, tag:${TAG_NAME})"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Auto Bump Version in Gradle Files
        run: |
          sed -i -E "s/versionCode([ =]+)[0-9]+/versionCode\1${{ env.VERSION_CODE }}/" app/build.gradle* || true
          sed -i -E "s/versionName([ =]+)\"[^\"]+\"/versionName\1\"${{ env.VERSION_NAME }}\"/" app/build.gradle* || true

      - name: Get Current Date
        id: date
        run: echo "date=$(date -u +'\%Y-\%m-\%d \%H:\%M UTC')" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle 9.3.1 Wrapper
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Consistent Keystore
        env:
          KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_DATA" ]; then
            echo "Using provided KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_DATA" | base64 -d > ~/.android/debug.keystore
          else
            echo "Fallback: generating new debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp ~/.android/debug.keystore ./debug.keystore || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ env.VERSION_NAME }}" \
            -PversionCode="${{ env.VERSION_CODE }}" \
            --no-daemon

      - name: Prepare APK Asset
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No debug APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          OUTPUT_APK="SwanSpeed-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_FILE" "$OUTPUT_APK"
          echo "Debug APK ready: $OUTPUT_APK"

      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: SwanSpeed ${{ env.TAG_NAME }}
          body: |
            ## SwanSpeed - Native Android Network Speed Tester
            
            - **Version:** `${{ env.VERSION_NAME }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Build Date:** `${{ steps.date.outputs.date }}`
            
            ### 📥 Download & Install
            Download the debug APK asset attached below:
            * **`SwanSpeed-v${{ env.VERSION_NAME }}.apk`**
          files: |
            SwanSpeed-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
